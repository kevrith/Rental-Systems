[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()-as-default idiom

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Async fixtures share the test's own loop. asyncpg connections are bound to the
# loop that opened them, so anything wider leaks connections across loops.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# SQLAlchemy echoes every statement and WeasyPrint's font stack is extremely
# chatty at DEBUG; both bury the actual assertion in failure output.
log_cli_level = "WARNING"
log_level = "WARNING"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
