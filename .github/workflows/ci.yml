name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        # CI_DB_PASSWORD is a repository secret (Settings -> Secrets and variables -> Actions).
        # Any value works — this database only ever exists for the lifetime of this job.
        env:
          POSTGRES_USER: rentflow
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: rentflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rentflow:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/rentflow_test
      DATABASE_URL_SYNC: postgresql+psycopg2://rentflow:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/rentflow_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate ephemeral JWT signing key for this run
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Run migrations
        run: alembic upgrade head

      # The coverage floor lives in pyproject.toml's [tool.coverage.report], so
      # the number CI enforces is the same one a developer sees locally.
      - name: Test with coverage (pytest)
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test:coverage

      - name: Build (typecheck + vite build)
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

  # Supply chain. Dependabot already opens PRs for known-vulnerable versions,
  # but only on its own schedule and only for what it recognises — this fails
  # the build on the day a advisory lands against something already installed.
  supply-chain:
    name: Supply chain (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # Audits the pinned set rather than a resolved environment, so the result
      # matches what actually ships.
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # `--production` because a vulnerability in a build-time tool is a real
      # but far lower-severity finding than one in code served to a browser,
      # and a blocking gate that fires on the second kind gets switched off.
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # `security-and-quality` over the default `security` set: this is a
          # single-maintainer codebase, and the quality queries catch the kind
          # of latent bug that would otherwise wait for a customer to find.
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
