name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        # CI_DB_PASSWORD is a repository secret (Settings -> Secrets and variables -> Actions).
        # Any value works — this database only ever exists for the lifetime of this job.
        env:
          POSTGRES_USER: rentflow
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: rentflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rentflow:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/rentflow_test
      DATABASE_URL_SYNC: postgresql+psycopg2://rentflow:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/rentflow_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate ephemeral JWT signing key for this run
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Run migrations
        run: alembic upgrade head

      # The coverage floor lives in pyproject.toml's [tool.coverage.report], so
      # the number CI enforces is the same one a developer sees locally.
      - name: Test with coverage (pytest)
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test:coverage

      - name: Build (typecheck + vite build)
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

  # End-to-end: a real backend against a real Postgres, a production frontend
  # build served the way it actually ships, and a real Chromium driving both.
  # This is the layer `npm run test` deliberately does not cover — its own
  # config says so — and it is where a defect is a customer's money or a
  # customer's data, not a broken button.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rentflow
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: rentflow_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rentflow:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/rentflow_e2e
      DATABASE_URL_SYNC: postgresql+psycopg2://rentflow:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/rentflow_e2e
      REDIS_URL: redis://localhost:6379/0
      E2E_BASE_URL: http://localhost:4173
      E2E_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Generate ephemeral JWT signing key for this run
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      # Backgrounded and outlived by the job's later steps; GitHub Actions
      # tears the whole runner down at job end, so there is nothing to stop
      # explicitly.
      - name: Start the backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          npx --yes wait-on@8 -t 30000 http://localhost:8000/api/v1/health

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # A production build, not `vite dev` — that is what actually ships, and
      # what the E2E suite should be catching regressions in.
      - name: Build the frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Serve the built frontend
        working-directory: frontend
        run: |
          nohup npx vite preview --port 4173 --host > ../frontend.log 2>&1 &
          npx --yes wait-on@8 -t 30000 http://localhost:4173

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-service-logs
          path: |
            backend.log
            frontend.log
          if-no-files-found: warn

  # Supply chain. Dependabot already opens PRs for known-vulnerable versions,
  # but only on its own schedule and only for what it recognises — this fails
  # the build on the day a advisory lands against something already installed.
  supply-chain:
    name: Supply chain (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # Audits the pinned set rather than a resolved environment, so the result
      # matches what actually ships.
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # `--production` because a vulnerability in a build-time tool is a real
      # but far lower-severity finding than one in code served to a browser,
      # and a blocking gate that fires on the second kind gets switched off.
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rentflow-backend
            context: backend
          - image: rentflow-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ${{ matrix.image }}:ci ${{ matrix.context }}

      # Two runs on purpose: the SARIF one always succeeds so the results
      # still reach the code-scanning tab even when findings exist, and the
      # second one is the actual gate — `exit-code: 1` is what fails the job.
      - name: Scan for vulnerabilities (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Scan for vulnerabilities (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          # `security-and-quality` over the default `security` set: this is a
          # single-maintainer codebase, and the quality queries catch the kind
          # of latent bug that would otherwise wait for a customer to find.
          # The query set is repeated in config-file (queries: here is
          # otherwise overridden, not merged, by the config file's own list).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
