# Same headers as vercel.json — this image serves the same build, so a
# self-hosted deploy shouldn't be weaker than the Vercel one.
#
# Included from every `location` block rather than set once on `server`:
# nginx only inherits `add_header` from an outer block into a location that
# defines none of its own, and every location below sets a Cache-Control —
# so a server-level-only version of these was silently dropped everywhere.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
