server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames under /assets never change content, so cache them
    # forever; everything else defaults to must-revalidate below.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker and its manifest have to be re-checked on every load,
    # or a stale one would keep serving an old app shell indefinitely.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Client-side routing: any path that isn't a real static file falls back
    # to index.html, which is itself never cached so a new deploy is visible
    # immediately instead of waiting out an old copy's TTL.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri /index.html;
    }
}
